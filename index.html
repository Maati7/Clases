<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

:root{
  --cover: #C0121F;
  --cover-dark: #960C17;
  --page: #FBF7F0;
  --page-line: #E4DACD;
  --ink: #2B2420;
  --ink-soft: #83766A;
  --sage: #6F8F71;
  --sage-bg: #E7EEE3;
  --clay: #C1633C;
  --clay-bg: #F5E4D8;
  --gold: #B08D4F;
  --gold-bg: #F1E7D2;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  color:var(--ink);
  background:var(--page-line);
  min-height:100vh;
  padding:24px 16px 60px;
}

.book{
  max-width:760px;
  margin:0 auto;
  background:var(--page);
  border-radius:4px;
  box-shadow:0 1px 0 rgba(0,0,0,.03), 0 12px 30px rgba(43,36,32,.14);
  overflow:hidden;
}

.cover{
  background:linear-gradient(155deg,var(--cover),var(--cover-dark));
  color:var(--page);
  padding:34px 30px 26px;
  position:relative;
}

.cover h1{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:30px;
  margin:0 0 4px;
  letter-spacing:.2px;
}

.cover p{
  margin:0;
  font-size:14px;
  color:#FBE3E5;
  font-weight:400;
}

#save-indicator{
  position:absolute;
  top:26px;
  right:64px;
  font-size:11.5px;
  font-weight:500;
  color:#FBE3E5;
  opacity:0;
  transition:opacity .4s ease;
}
#save-indicator.show{opacity:1;}

nav{
  display:flex;
  border-bottom:1px solid var(--page-line);
  background:#F3EEE3;
  overflow-x:auto;
}

nav button{
  flex:1 1 auto;
  padding:14px 8px;
  border:none;
  background:transparent;
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  font-weight:500;
  color:var(--ink-soft);
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color .15s ease, border-color .15s ease;
  white-space:nowrap;
}

nav button.active{
  color:var(--cover);
  border-bottom-color:var(--cover);
  background:var(--page);
}

main{
  padding:26px 28px 34px;
  min-height:320px;
}

h2.section-title{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:19px;
  margin:0 0 18px;
}

h3.calc-title{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:16px;
  margin:0 0 14px;
}

.empty{
  color:var(--ink-soft);
  font-size:14px;
  padding:22px 0;
  border-top:1px dashed var(--page-line);
  text-align:center;
}

.form-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:4px;
  flex:1;
  min-width:120px;
}

.field label{
  font-size:11.5px;
  color:var(--ink-soft);
  font-weight:500;
}

input, select, textarea{
  font-family:'Inter',sans-serif;
  font-size:16px;
  padding:10px 11px;
  border:1px solid var(--page-line);
  border-radius:3px;
  background:#fff;
  color:var(--ink);
  width:100%;
}

textarea{resize:vertical; min-height:60px;}

input:focus, select:focus, textarea:focus{
  outline:none;
  border-color:var(--cover);
}

.btn{
  font-family:'Inter',sans-serif;
  font-size:14px;
  font-weight:600;
  padding:11px 18px;
  min-height:44px;
  border-radius:3px;
  border:1px solid var(--cover);
  background:var(--cover);
  color:var(--page);
  cursor:pointer;
  transition:opacity .15s ease;
}
.btn:hover{opacity:.88;}
.btn.secondary{
  background:transparent;
  color:var(--cover);
}
.btn.small{
  padding:6px 12px;
  font-size:12.5px;
}
.btn.link{
  background:none;
  border:none;
  color:var(--cover);
  text-decoration:underline;
  padding:0;
  font-size:12.5px;
}

.ledger{
  border-top:1px solid var(--page-line);
}
.section-block .ledger > .row:last-child{border-bottom:none;}

.row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--page-line);
}

.row-main{flex:1; min-width:0;}

.row-top{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.row-name{
  font-family:'Fraunces',serif;
  font-size:16px;
  font-weight:500;
}

.row-sub{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-top:2px;
}

.row-note{
  font-size:12.5px;
  color:var(--ink-soft);
  font-style:italic;
  margin-top:4px;
}

.row-actions{
  display:flex;
  gap:6px;
  flex-shrink:0;
  align-items:center;
}

.badge{
  font-size:11px;
  font-weight:600;
  padding:3px 9px;
  border-radius:20px;
  white-space:nowrap;
}
.badge.gold{background:var(--gold-bg); color:var(--gold);}
.badge.sage{background:var(--sage-bg); color:var(--sage);}
.badge.clay{background:var(--clay-bg); color:var(--clay);}

.icon-btn{
  border:none;
  background:none;
  color:var(--ink-soft);
  cursor:pointer;
  font-size:12.5px;
  padding:4px 6px;
}
.icon-btn:hover{color:var(--clay);}

.select-student{
  margin-bottom:18px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(96px, 1fr));
  gap:10px;
  margin-bottom:18px;
}
.summary .card{
  min-width:0;
  background:#F3EEE3;
  border-radius:4px;
  padding:12px 14px;
}
.summary .card .num{
  font-family:'Fraunces',serif;
  font-size:20px;
  font-weight:500;
}
.summary .card .lbl{
  font-size:11.5px;
  color:var(--ink-soft);
  margin-top:2px;
}

.att-buttons{
  display:flex;
  gap:8px;
}
.att-btn{
  flex:1;
  padding:10px;
  border-radius:3px;
  border:1px solid var(--page-line);
  background:#fff;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  color:var(--ink-soft);
}
.att-btn{transition:background .15s ease, color .15s ease, border-color .15s ease;}
.att-btn.presente.chosen{background:var(--sage); border-color:var(--sage); color:#fff;}
.att-btn.ausente.chosen{background:var(--clay); border-color:var(--clay); color:#fff;}
.att-btn.reprogramada.chosen{background:var(--gold); border-color:var(--gold); color:#fff;}
.att-btn.chosen::before{content:'✓ ';}

.calc-box{
  margin-top:26px;
  padding-top:20px;
  border-top:1px solid var(--page-line);
}

.calc-result{margin-top:14px;}
.calc-result table{width:100%; border-collapse:collapse;}
.calc-result th, .calc-result td{
  text-align:left;
  padding:8px 4px;
  font-size:13.5px;
  border-bottom:1px solid var(--page-line);
}
.calc-result th{color:var(--ink-soft); font-weight:500; font-size:11.5px;}
.calc-result td.amount{font-family:'Fraunces',serif; font-weight:500;}
.calc-result .calc-total{margin-top:10px; font-size:13px; color:var(--ink-soft);}

.section-block{
  margin-top:26px;
  padding-top:20px;
  border-top:1px solid var(--page-line);
}

.backup-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:8px;
}

.footnote{
  text-align:center;
  font-size:11.5px;
  color:var(--ink-soft);
  margin-top:16px;
}

<body>

<div class="book">
  <div class="cover">
    <span id="save-indicator">Guardado ✓</span>
    <button type="button" id="help-btn" aria-label="Ver guía de uso">?</button>

  </div>

  <nav>
    <button class="tab-btn active" data-tab="resumen">Resumen</button>
    <button class="tab-btn" data-tab="alumnos">Alumnos</button>
    <button class="tab-btn" data-tab="pagos">Pagos</button>
    <button class="tab-btn" data-tab="asistencia">Asistencia</button>

  </nav>

  <main id="main"></main>
</div>

<div class="tutorial" id="tutorial" role="dialog" aria-modal="true" aria-labelledby="tut-title">

    <div class="tutorial-emoji" id="tut-emoji"></div>

      </div>
    </div>
  </div>
</div>

<details class="backup-footer">
  <summary>Copia de seguridad</summary>
  <p class="row-sub">Los datos se guardan en la nube y se sincronizan entre dispositivos. Igual conviene bajar un backup de tanto en tanto, por las dudas.</p>
  <div class="backup-buttons">
    <button type="button" class="btn secondary small" id="export-btn">Descargar backup (.json)</button>
    <button type="button" class="btn secondary small" id="import-btn">Restaurar backup</button>
    <input type="file" id="import-file" accept="application/json" style="display:none;">
  </div>
</details>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5aq_aSrT3wB2etn0O9CKUQz1wpVGXxFc",
  authDomain: "clases-4c1ab.firebaseapp.com",
  projectId: "clases-4c1ab",
  storageBucket: "clases-4c1ab.firebasestorage.app",
  messagingSenderId: "1087866767270",
  appId: "1:1087866767270:web:28b84996c3ce556ee9f167"
};

const fbApp = initializeApp(firebaseConfig);
// Caché local: la app abre al instante y funciona sin señal, aunque haya varias pestañas abiertas
const db = initializeFirestore(fbApp, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});
const docRef = doc(db, 'clases-ingles', 'data');

const DAYS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
let dataLoaded = false;
let state = { students: [], payments: [], attendance: [], topics: [], grades: [], offDays: [] };
let activeTab = 'resumen';
let editingStudentId = null;
let selectedPagoStudent = null;
let selectedAsisStudent = null;
let selectedSeguimientoStudent = null;
let viewMonth = null;          // null = mes actual
let viewingStudentId = null;   // ficha abierta en Alumnos
let reportMonth = null;        // mes del informe en la ficha
let attendanceStatusChoice = 'presente';

let showArchived = false;
let pendingRender = false;

// Si está escribiendo en un formulario, esperamos a que termine antes de redibujar
function isTyping(){
  const el = document.activeElement;
  const main = document.getElementById('main');
  if(!el || !main || !main.contains(el)) return false;
  if(el.tagName === 'TEXTAREA') return true;
  if(el.tagName === 'INPUT') return !['checkbox','radio','button','submit','file'].includes(el.type);
  return false;
}
document.getElementById('main').addEventListener('focusout', ()=>{
  setTimeout(()=>{
    if(pendingRender && !isTyping()){ pendingRender = false; render(); }
  }, 150);
});

function subscribeToData(){
  onSnapshot(docRef, snap=>{
    // Eco de un guardado propio: la pantalla ya está actualizada
    if(dataLoaded && snap.metadata.hasPendingWrites) return;
    if(snap.exists()){
      const parsed = snap.data();
      state.students = parsed.students || [];
      state.payments = parsed.payments || [];
      state.attendance = parsed.attendance || [];
      state.topics = parsed.topics || [];
      state.grades = parsed.grades || [];
      state.offDays = parsed.offDays || [];
    }
    const first = !dataLoaded;
    dataLoaded = true;
    if(!first && isTyping()){ pendingRender = true; return; }
    render();
    if(first) maybeShowTutorial();
  }, err=>{
    console.error('Error de sincronización', err);
    flashSaved(false);
  });
}

async function saveData(){
  try{
    await setDoc(docRef, state);
    flashSaved(true);
  }catch(e){
    console.error('No se pudo guardar en la nube', e);
    flashSaved(false);
  }
}

function flashSaved(ok){
  const el = document.getElementById('save-indicator');
  if(!el) return;
  el.textContent = ok===false ? 'Sin conexión ⚠' : 'Guardado ✓';
  el.classList.add('show');
  clearTimeout(window._saveTimeout);
  window._saveTimeout = setTimeout(()=>el.classList.remove('show'), 1600);
}

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function localISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
// Fecha de hoy según la hora local del teléfono (no UTC)
function todayISO(){ return localISO(new Date()); }
function todayDayName(){ return DAYS[(new Date().getDay()+6)%7]; }
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('es-AR', {month:'long', year:'numeric'});
}
function shiftMonth(key, delta){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return localISO(d).slice(0,7);
}
// Compatibilidad: los alumnos viejos tenían un solo "day"
function studentDays(s){
  if(Array.isArray(s.days)) return s.days;
  return s.day ? [s.day] : [];
}
function capFirst(t){ return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
// "9:30" -> "09:30" (formato del selector de hora)
function cleanTime(t){
  const m = String(t||'').trim().match(/^(\d{1,2})[:.](\d{2})/);
  return m ? `${m[1].padStart(2,'0')}:${m[2]}` : '';
}
// "09:30" -> "9:30" para mostrar
function showTime(t){ return t ? t.replace(/^0(\d)/, '$1') : ''; }
// Horario de un alumno para un día. Entiende el formato viejo "17:30/16:00".
function timeFor(s, day){
  if(!s) return '';
  if(s.times && s.times[day]) return s.times[day];
  const days = studentDays(s);
  const parts = String(s.time||'').split(/\s*\/\s*|\s+y\s+/).filter(Boolean);
  if(parts.length > 1 && parts.length === days.length) return cleanTime(parts[days.indexOf(day)]);
  return cleanTime(s.time);
}
function scheduleText(s){
  const days = studentDays(s);
  if(isPorClase(s) && !days.length) return 'Clases sueltas';
  if(!days.length) return 'sin días';
  const times = days.map(d=>timeFor(s,d));
  if(times.every(t=>t===times[0])) return `${days.join(', ')} · ${showTime(times[0]) || 'sin horario'}`;
  return days.map((d,i)=>`${d} ${showTime(times[i]) || '—'}`).join(' · ');
}
function isPorClase(s){ return s && s.billing === 'clase'; }
function priceText(s){
  if(!s.price) return '';
  return ' · ' + currency(s.price) + (isPorClase(s) ? '/clase' : '/mes');
}
// Para alumnos por clase: cuánto deben según clases presentes menos lo pagado
function claseBalance(s){
  const clases = state.attendance.filter(a=>a.studentId===s.id && a.status==='presente');
  const cargado = clases.reduce((sum,a)=>sum + Number(a.price ?? s.price ?? 0), 0);
  const pagado = state.payments.filter(p=>p.studentId===s.id).reduce((sum,p)=>sum+Number(p.amount||0),0);
  const saldo = cargado - pagado;
  const precio = Number(s.price||0);
  const clasesAdeudadas = saldo > 0 && precio ? Math.ceil(saldo / precio) : 0;
  return {saldo, clasesAdeudadas};
}
// Le agrega el precio a una asistencia "presente" de un alumno por clase
function priceAttendance(rec){
  const s = state.students.find(x=>x.id===rec.studentId);
  if(rec.status==='presente' && isPorClase(s)) rec.price = Number(s.price||0);
  else delete rec.price;
  return rec;
}
// Convierte un número argentino a formato WhatsApp (549 + área + número)
function waPhone(raw){
  let d = String(raw||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('54')) d = d.slice(2);
  if(d.startsWith('9')) d = d.slice(1);
  if(d.startsWith('0')) d = d.slice(1);
  return '549' + d;
}
function waLink(s){
  const phone = waPhone(s.phone);
  if(!phone) return '';
  if(isPorClase(s)){
    const b = claseBalance(s);
    const detalle = b.clasesAdeudadas
      ? `${b.clasesAdeudadas} ${b.clasesAdeudadas===1 ? 'clase' : 'clases'} (${currency(b.saldo)})`
      : currency(b.saldo);
    const msgClase = [
      'Hola! Como estás?',
      'Te molesto con este recordatorio.',
      `📌Quedó pendiente el pago de ${detalle} 😊`,
      'Si se te complica, escribime y vemos cómo acomodarlo.',
      'Gracias!'
    ].join('\n');
    return `<a class="wa-btn" href="https://wa.me/${phone}?text=${encodeURIComponent(msgClase)}" target="_blank" rel="noopener">Recordar por WhatsApp</a>`;
  }
  const msg = [
    'Hola! Como estás?',
    'Te molesto con este recordatorio.',
    '📌Recordá que el pago mensual es del 1 al 10 de cada mes 😊',
    'Si se te complica esa fecha, escribime y vemos cómo acomodarlo.',
    'Gracias!'
  ].join('\n');
  return `<a class="wa-btn" href="https://wa.me/${phone}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Recordar por WhatsApp</a>`;
}
function activeStudents(){ return state.students.filter(s=>!s.archived); }
// Devuelve un alumno activo válido para los selectores
function pickStudent(id){
  const act = activeStudents();
  return act.some(s=>s.id===id) ? id : (act[0] ? act[0].id : null);
}
function offDayFor(iso){
  return state.offDays.find(o=>o.from <= iso && iso <= (o.to || o.from));
}
function nextOffDay(iso){
  return state.offDays.filter(o=>o.from > iso).sort((a,b)=>a.from.localeCompare(b.from))[0];
}
function offRangeText(o){
  return (!o.to || o.to===o.from) ? formatDate(o.from) : `${formatDate(o.from)} al ${formatDate(o.to)}`;
}
const STATUS_LABEL = {presente:'Presente', ausente:'Ausente', reprogramada:'Reprogramada'};
const STATUS_CLASS = {presente:'sage', ausente:'clay', reprogramada:'gold'};
function formatDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}
function currency(n){
  return '$' + Math.round(n).toLocaleString('es-AR');
}

function paymentStatus(studentId){
  const stu = state.students.find(x=>x.id===studentId);
  if(isPorClase(stu)){
    const b = claseBalance(stu);
    if(b.saldo > 0) return {status:'debe', label:`Debe ${currency(b.saldo)}`};
    return {status:'aldia', label:'Al día'};
  }
  const pays = state.payments.filter(p=>p.studentId===studentId).sort((a,b)=>b.date.localeCompare(a.date));
  if(pays.length===0) return {status:'debe', label:'Nunca pagó'};
  const days = Math.floor((Date.now() - new Date(pays[0].date+'T00:00:00')) / 86400000);
  if(days > 35) return {status:'debe', label:`Debe · hace ${days} días`};
  return {status:'aldia', label:'Al día'};
}

function switchTab(tab){
  activeTab = tab;
  viewingStudentId = null;
  editingStudentId = null;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  render();
}
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click', ()=>switchTab(b.dataset.tab));
});

function render(){
  const main = document.getElementById('main');
  if(!dataLoaded){
    main.innerHTML = '<div class="empty">Cargando…</div>';
    return;
  }
  if(activeTab==='resumen') main.innerHTML = renderResumen();
  if(activeTab==='alumnos') main.innerHTML = renderAlumnos();
  if(activeTab==='pagos') main.innerHTML = renderPagos();
  if(activeTab==='asistencia') main.innerHTML = renderAsistencia();
  if(activeTab==='seguimiento') main.innerHTML = renderSeguimiento();
  attachHandlers();
}

/* ---------- RESUMEN ---------- */
function renderResumen(){
  const currentMonth = todayISO().slice(0,7);
  const monthKey = viewMonth || currentMonth;
  const isCurrent = monthKey === currentMonth;

  const cobradoMes = state.payments.filter(p=>p.date.slice(0,7)===monthKey)
    .reduce((s,p)=>s+Number(p.amount||0),0);
  const clasesMes = state.attendance.filter(a=>a.date.slice(0,7)===monthKey && a.status==='presente').length;
  const ausenciasMes = state.attendance.filter(a=>a.date.slice(0,7)===monthKey && a.status==='ausente').length;

  let hoyBlock = '';
  let pendientesBlock = '';

  // Lo que falta cobrar este mes: mensuales sin pagar (o con pago parcial) + saldo de clases sueltas
  const aCobrar = isCurrent ? activeStudents().reduce((sum, st)=>{
    if(isPorClase(st)) return sum + Math.max(0, claseBalance(st).saldo);
    const pagadoMes = state.payments
      .filter(p=>p.studentId===st.id && p.date.slice(0,7)===monthKey)
      .reduce((t,p)=>t+Number(p.amount||0), 0);
    return sum + Math.max(0, Number(st.price||0) - pagadoMes);
  }, 0) : 0;

  if(isCurrent){
    const today = todayISO();
    const dayName = todayDayName();
    const off = offDayFor(today);
    const next = nextOffDay(today);
    const hoy = activeStudents()
      .filter(s=>studentDays(s).includes(dayName))
      .sort((a,b)=>timeFor(a,dayName).localeCompare(timeFor(b,dayName)));

    const hoyRows = hoy.map(s=>{
      const rec = state.attendance.find(a=>a.studentId===s.id && a.date===today);

        <a class="wa-btn" id="report-wa" target="_blank" rel="noopener"
           href="https://wa.me/?text=${encodeURIComponent(buildReport(s, reportMonth || todayISO().slice(0,7)))}">Enviar por WhatsApp</a>

function buildReport(s, monthKey){
  const inMonth = x => x.date.slice(0,7) === monthKey;
  const byDate = (a,b)=>a.date.localeCompare(b.date);
  const att = state.attendance.filter(a=>a.studentId===s.id && inMonth(a));
  const presentes = att.filter(a=>a.status==='presente').length;
  const ausentes = att.filter(a=>a.status==='ausente').length;
  const reprog = att.filter(a=>a.status==='reprogramada').length;
  const topics = state.topics.filter(t=>t.studentId===s.id && inMonth(t)).sort(byDate);
  const grades = state.grades.filter(g=>g.studentId===s.id && inMonth(g)).sort(byDate);
  const mes = monthLabel(monthKey);
  const first = (s.name||'').trim().split(' ')[0];

  const lines = [];
  lines.push(`📘 Informe de ${mes} — ${first}`);
  lines.push('');
  let asis = `✅ Clases: ${presentes}`;
  if(ausentes) asis += ` · Ausencias: ${ausentes}`;
  if(reprog) asis += ` · Reprogramadas: ${reprog}`;
  lines.push(asis);
  if(topics.length){
    lines.push('');
    lines.push('📚 Temas que vimos:');
    topics.forEach(t=>lines.push(`• ${t.topic}`));
  }
  if(grades.length){
    lines.push('');
    lines.push('📝 Evaluaciones:');
    grades.forEach(g=>lines.push(`• ${formatDate(g.date)}: ${g.grade}${g.comment ? ' — '+g.comment : ''}`));
  }
  if(s.objectives){
    lines.push('');
    lines.push(`🎯 Objetivo: ${s.objectives}`);
  }
  lines.push('');
  lines.push('¡Gracias por la confianza! Cualquier consulta, escribime 😊');
  return lines.join('\n');
}

  const list = [...state.offDays].sort((a,b)=>a.from.localeCompare(b.from));
  const rows = list.map(o=>`
    <div class="row ${(o.to||o.from) < today ? 'offday-past':''}">
      <div class="row-main">
        <div class="row-name">${escapeHtml(o.label || 'Día libre')}</div>
        <div class="row-sub">${offRangeText(o)}</div>
      </div>
      <button class="icon-btn" data-del-off="${o.id}">Eliminar</button>
    </div>
  `).join('');
  return `
    <div class="section-block">
      <h3 class="calc-title">Feriados y vacaciones</h3>
      <p class="row-sub" style="margin:0 0 12px;">Los días que cargues acá no muestran clases en "Hoy".</p>
      <form id="off-form">
        <div class="form-row">
          <div class="field">
            <label>Desde</label>
            <input type="date" name="from" required value="${today}">
          </div>
          <div class="field">
            <label>Hasta (si es un solo día, dejalo vacío)</label>
            <input type="date" name="to">
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Motivo</label>
            <input type="text" name="label" placeholder="Ej: Feriado, vacaciones de invierno">
          </div>
        </div>
        <button type="submit" class="btn small">Agregar</button>
      </form>
      <div class="ledger" style="margin-top:14px;">
        ${rows || '<div class="empty">No cargaste feriados ni vacaciones</div>'}
      </div>
    </div>
  `;
}

/* ---------- SEGUIMIENTO ---------- */
function renderSeguimiento(){
  if(activeStudents().length===0){
    return `<h2 class="section-title">Seguimiento</h2><div class="empty">Cargá primero un alumno en la pestaña Alumnos</div>`;
  }
  const options = activeStudents().map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
  const selected = selectedSeguimientoStudent = pickStudent(selectedSeguimientoStudent);
  const student = state.students.find(s=>s.id===selected);

  const topics = state.topics.filter(t=>t.studentId===selected).sort((a,b)=>b.date.localeCompare(a.date));
  const grades = state.grades.filter(g=>g.studentId===selected).sort((a,b)=>b.date.localeCompare(a.date));

  const topicRows = topics.map(t=>`
    <div class="row">
      <div class="row-main">
        <div class="row-name">${formatDate(t.date)}</div>
        <div class="row-sub">${escapeHtml(t.topic)}</div>
      </div>
      <button class="icon-btn" data-del-topic="${t.id}">Eliminar</button>
    </div>
  `).join('');

  const gradeRows = grades.map(g=>`
    <div class="row">
      <div class="row-main">
        <div class="row-name">${escapeHtml(g.grade)}</div>
        <div class="row-sub">${formatDate(g.date)}${g.comment ? ' · '+escapeHtml(g.comment) : ''}</div>
      </div>
      <button class="icon-btn" data-del-grade="${g.id}">Eliminar</button>
    </div>
  `).join('');

  return `
    <h2 class="section-title">Seguimiento</h2>
    <div class="select-student">
      <select id="seg-student-select">${options}</select>
    </div>

    <h3 class="calc-title">Objetivo</h3>
    <form id="objective-form">
      <div class="form-row">
        <div class="field">
          <textarea name="objectives" placeholder="Ej: preparar entrevista laboral en inglés">${escapeHtml(student.objectives||'')}</textarea>
        </div>
      </div>
      <button type="submit" class="btn small">Guardar objetivo</button>
    </form>

    <div class="section-block">
      <h3 class="calc-title">Temas dados</h3>
      <form id="topic-form">
        <div class="form-row">
          <div class="field" style="max-width:140px;">
            <label>Fecha</label>
            <input type="date" name="date" required value="${todayISO()}">
          </div>
          <div class="field">
            <label>Tema</label>
            <input type="text" name="topic" required placeholder="Ej: present perfect, vocabulario de viajes">
          </div>
        </div>
        <button type="submit" class="btn small">Agregar tema</button>
      </form>
      <div class="ledger" style="margin-top:14px;">
        ${topicRows || '<div class="empty">Todavía no hay temas cargados</div>'}
      </div>
    </div>

    <div class="section-block">
      <h3 class="calc-title">Notas de evaluaciones</h3>
      <form id="grade-form">
        <div class="form-row">
          <div class="field">
            <label>Fecha</label>
            <input type="date" name="date" required value="${todayISO()}">
          </div>
          <div class="field">
            <label>Nota / calificación</label>
            <input type="text" name="grade" required placeholder="Ej: 9, o 'Muy bueno'">
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Comentario (opcional)</label>
            <input type="text" name="comment" placeholder="Ej: mejoró mucho el listening">
          </div>
        </div>
        <button type="submit" class="btn small">Agregar nota</button>
      </form>
      <div class="ledger" style="margin-top:14px;">
        ${gradeRows || '<div class="empty">Todavía no hay notas cargadas</div>'}
      </div>
    </div>
  `;
}

/* ---------- HANDLERS ---------- */
function attachHandlers(){
  // Alumnos
  const studentForm = document.getElementById('student-form');
  if(studentForm){
    studentForm.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(studentForm);
      const days = DAYS.filter(d=>fd.getAll('days').includes(d));
      const billing = fd.get('billing') === 'clase' ? 'clase' : 'mensual';
      if(days.length===0 && billing==='mensual'){
        alert('Elegí al menos un día de clase');
        return;
      }
      const data = {
        name: fd.get('name').trim(),
        phone: fd.get('phone').trim(),
        billing,
        days,
        freq: String(days.length),
        times: Object.fromEntries(days.map(d=>[d, fd.get('time_'+d) || '']).filter(x=>x[1])),
        price: fd.get('price') || 0,
        objectives: fd.get('objectives').trim()
      };
      if(editingStudentId){
        const s = state.students.find(s=>s.id===editingStudentId);
        delete s.day;
        delete s.time;
        Object.assign(s, data);
        editingStudentId = null;
      } else {
        state.students.push({id: uid(), ...data});
      }
      saveData();
      render();
    });
  }

  document.querySelectorAll('.day-checks input[name="days"]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const row = document.querySelector(`[data-day-time="${cb.value}"]`);
      if(!row) return;
      row.hidden = !cb.checked;
      if(cb.checked){
        // Si ya hay otro día con horario, se lo propone como punto de partida
        const input = row.querySelector('input');
        if(!input.value){
          const other = [...document.querySelectorAll('.day-time:not([hidden]) input')].find(i=>i!==input && i.value);
          if(other) input.value = other.value;
        }
      }
    });
  });

  const billingSelect = document.getElementById('billing-select');
  if(billingSelect){
    billingSelect.addEventListener('change', ()=>{
      const porClase = billingSelect.value === 'clase';
      document.getElementById('price-label').textContent = porClase ? 'Precio por clase' : 'Precio mensual';
      document.getElementById('days-optional').textContent = porClase ? '(opcional)' : '';
    });
  }

  // Informe mensual
  const reportInput = document.getElementById('report-month');
  if(reportInput){
    reportInput.addEventListener('change', ()=>{
      if(!reportInput.value) return;
      reportMonth = reportInput.value;
      render();
    });
  }
  const reportCopy = document.getElementById('report-copy');
  if(reportCopy){
    reportCopy.addEventListener('click', async ()=>{
      const text = document.getElementById('report-text').textContent;
      try{
        await navigator.clipboard.writeText(text);
        reportCopy.textContent = 'Copiado ✓';
      }catch(e){
        reportCopy.textContent = 'No se pudo copiar';
      }
      setTimeout(()=>{ reportCopy.textContent = 'Copiar texto'; }, 1600);
    });
  }

  const cancelEdit = document.getElementById('cancel-edit');
  if(cancelEdit){
    cancelEdit.addEventListener('click', ()=>{
      editingStudentId = null;
      render();
    });
  }

  document.querySelectorAll('[data-edit-student]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingStudentId = btn.dataset.editStudent;
      viewingStudentId = null;
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });

  document.querySelectorAll('[data-del-student]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.delStudent;
      if(!confirm('¿Eliminar este alumno y todos sus datos asociados?')) return;
      state.students = state.students.filter(s=>s.id!==id);
      state.payments = state.payments.filter(p=>p.studentId!==id);
      state.attendance = state.attendance.filter(a=>a.studentId!==id);
      state.topics = state.topics.filter(t=>t.studentId!==id);
      state.grades = state.grades.filter(g=>g.studentId!==id);
      saveData();
      render();
    });
  });

  const searchInput = document.getElementById('student-search');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      const q = searchInput.value.trim().toLowerCase();
      document.querySelectorAll('[data-student-row]').forEach(row=>{
        const name = row.querySelector('.row-name').textContent.toLowerCase();
        row.style.display = name.includes(q) ? '' : 'none';
      });
    });
  }

  // Archivar / reactivar
  document.querySelectorAll('[data-archive-student]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const s = state.students.find(x=>x.id===btn.dataset.archiveStudent);
      if(!confirm(`¿Archivar a ${s.name}? Se guarda todo su historial y lo podés reactivar cuando quieras.`)) return;
      s.archived = true;
      saveData();
      render();
    });
  });
  document.querySelectorAll('[data-unarchive-student]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const s = state.students.find(x=>x.id===btn.dataset.unarchiveStudent);
      delete s.archived;
      saveData();
      render();
    });
  });
  const toggleArchived = document.getElementById('toggle-archived');
  if(toggleArchived){
    toggleArchived.addEventListener('click', ()=>{
      showArchived = !showArchived;
      render();
    });
  }

  // Feriados y vacaciones
  const offForm = document.getElementById('off-form');
  if(offForm){
    offForm.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(offForm);
      const from = fd.get('from');
      let to = fd.get('to') || from;
      if(to < from){ alert('La fecha "hasta" no puede ser anterior a "desde"'); return; }
      state.offDays.push({id: uid(), from, to, label: fd.get('label').trim()});
      saveData();
      render();
    });
  }
  document.querySelectorAll('[data-del-off]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar este día libre?')) return;
      state.offDays = state.offDays.filter(o=>o.id!==btn.dataset.delOff);
      saveData();
      render();
    });
  });

  // Ficha
  document.querySelectorAll('[data-open-student]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      viewingStudentId = btn.dataset.openStudent;
      editingStudentId = null;
      reportMonth = null;
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
  const fichaBack = document.getElementById('ficha-back');
  if(fichaBack){
    fichaBack.addEventListener('click', ()=>{
      viewingStudentId = null;
      render();
    });
  }

  // Resumen: navegación de meses
  const mPrev = document.getElementById('month-prev');
  const mNext = document.getElementById('month-next');
  const mToday = document.getElementById('month-today');
  const curMonth = todayISO().slice(0,7);
  if(mPrev) mPrev.addEventListener('click', ()=>{
    viewMonth = shiftMonth(viewMonth || curMonth, -1);
    render();
  });
  if(mNext) mNext.addEventListener('click', ()=>{
    const next = shiftMonth(viewMonth || curMonth, 1);
    viewMonth = next >= curMonth ? null : next;
    render();
  });
  if(mToday) mToday.addEventListener('click', ()=>{ viewMonth = null; render(); });

  // Resumen: asistencia rápida de hoy
  document.querySelectorAll('[data-quick-att]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const studentId = btn.dataset.quickAtt;
      const status = btn.dataset.status;
      const today = todayISO();
      const rec = state.attendance.find(a=>a.studentId===studentId && a.date===today);
      if(rec){
        if(rec.status===status) return;
        rec.status = status;
        priceAttendance(rec);
      } else {
        state.attendance.push(priceAttendance({id: uid(), studentId, date: today, status, note: ''}));
      }
      saveData();
      render();
    });
  });

  // Pagos
  const pagoSelect = document.getElementById('pago-student-select');
  if(pagoSelect){
    pagoSelect.value = selectedPagoStudent;
    pagoSelect.addEventListener('change', ()=>{
      selectedPagoStudent = pagoSelect.value;
      render();
    });
  }

  const paymentForm = document.getElementById('payment-form');
  if(paymentForm){
    paymentForm.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(paymentForm);
      state.payments.push({
        id: uid(),
        studentId: pagoSelect.value,
        amount: fd.get('amount'),
        date: fd.get('date'),
        note: fd.get('note').trim()
      });
      saveData();
      render();
    });
  }

  document.querySelectorAll('[data-del-payment]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar este pago?')) return;
      state.payments = state.payments.filter(p=>p.id!==btn.dataset.delPayment);
      saveData();
      render();
    });
  });

  // Aplicar aumento
  const raisePercent = document.getElementById('raise-percent');
  if(raisePercent){
    const raiseRound = document.getElementById('raise-round');
    const boxes = [...document.querySelectorAll('[data-raise-id]')];
    const toggleAll = document.getElementById('raise-toggle-all');
    const newPrice = st => roundUp(Number(st.price||0) * (1 + Number(raisePercent.value||0)/100), Number(raiseRound.value));
    const updatePreview = ()=>{
      const pct = Number(raisePercent.value||0);
      boxes.forEach(cb=>{
        const st = state.students.find(x=>x.id===cb.dataset.raiseId);
        const cell = document.querySelector(`[data-raise-preview="${st.id}"]`);
        cb.closest('.raise-row').classList.toggle('off', !cb.checked);
        cell.innerHTML = (pct > 0 && cb.checked)
          ? `${currency(st.price)} → <b>${currency(newPrice(st))}</b>`
          : currency(st.price);
      });
      toggleAll.textContent = boxes.every(cb=>cb.checked) ? 'Desmarcar todos' : 'Marcar todos';
    };
    raisePercent.addEventListener('input', updatePreview);
    raiseRound.addEventListener('change', updatePreview);
    boxes.forEach(cb=>cb.addEventListener('change', updatePreview));
    toggleAll.addEventListener('click', ()=>{
      const all = boxes.every(cb=>cb.checked);
      boxes.forEach(cb=>{ cb.checked = !all; });
      updatePreview();
    });
    document.getElementById('raise-apply').addEventListener('click', ()=>{
      const pct = Number(raisePercent.value||0);
      const chosen = boxes.filter(cb=>cb.checked).map(cb=>state.students.find(x=>x.id===cb.dataset.raiseId));
      if(!(pct > 0)){ alert('Poné el porcentaje de aumento'); return; }
      if(!chosen.length){ alert('Marcá al menos un alumno'); return; }
      const n = chosen.length;
      if(!confirm(`¿Aumentar ${pct}% el precio de ${n} ${n===1 ? 'alumno' : 'alumnos'}?`)) return;
      chosen.forEach(st=>{ st.price = newPrice(st); });
      saveData();
      render();
      alert('¡Listo! Precios actualizados.');
    });
  }

  const calcUseTotal = document.getElementById('calc-use-total');
  if(calcUseTotal){
    calcUseTotal.addEventListener('click', ()=>{
      const total = activeStudents().filter(st=>!isPorClase(st)).reduce((s,st)=>s+Number(st.price||0),0);
      document.getElementById('calc-price').value = total;
    });
  }

  const calcBtn = document.getElementById('calc-btn');
  if(calcBtn){
    calcBtn.addEventListener('click', ()=>{
      const price = Number(document.getElementById('calc-price').value);
      const percent = Number(document.getElementById('calc-percent').value);
      const months = Math.max(1, Number(document.getElementById('calc-months').value) || 1);
      const resultBox = document.getElementById('calc-result');
      if(!price || !percent){
        resultBox.innerHTML = '<div class="empty" style="border-top:none;padding:10px 0;">Completá precio actual y % de aumento</div>';
        return;
      }
      let current = price;
      let rowsHtml = '';
      for(let i=1;i<=months;i++){
        current = current * (1 + percent/100);
        rowsHtml += `<tr><td>Mes ${i}</td><td class="amount">${currency(current)}</td></tr>`;
      }
      const totalIncrease = current - price;
      resultBox.innerHTML = `
        <table>
          <thead><tr><th>Proyección</th><th>Precio</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <div class="calc-total">Aumento acumulado: ${currency(totalIncrease)} (de ${currency(price)} a ${currency(current)})</div>
      `;
    });
  }

  // Asistencia
  const asisSelect = document.getElementById('asis-student-select');
  if(asisSelect){
    asisSelect.value = selectedAsisStudent;
    asisSelect.addEventListener('change', ()=>{
      selectedAsisStudent = asisSelect.value;
      render();
    });
  }

  const attChoice = document.getElementById('att-choice');
  attendanceStatusChoice = 'presente';
  if(attChoice){
    attChoice.querySelectorAll('.att-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        attendanceStatusChoice = btn.dataset.status;
        attChoice.querySelectorAll('.att-btn').forEach(b=>b.classList.remove('chosen'));
        btn.classList.add('chosen');
      });
    });
  }

  const attendanceForm = document.getElementById('attendance-form');
  if(attendanceForm){
    attendanceForm.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(attendanceForm);
      state.attendance.push(priceAttendance({
        id: uid(),
        studentId: asisSelect.value,
        date: fd.get('date'),
        status: attendanceStatusChoice,
        note: fd.get('note').trim()
      }));
      saveData();
      render();
    });
  }

  document.querySelectorAll('[data-del-att]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar este registro de asistencia?')) return;
      state.attendance = state.attendance.filter(a=>a.id!==btn.dataset.delAtt);
      saveData();
      render();
    });
  });

  // Seguimiento
  const segSelect = document.getElementById('seg-student-select');
  if(segSelect){
    segSelect.value = selectedSeguimientoStudent;
    segSelect.addEventListener('change', ()=>{
      selectedSeguimientoStudent = segSelect.value;
      render();
    });
  }

  const objectiveForm = document.getElementById('objective-form');
  if(objectiveForm){
    objectiveForm.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(objectiveForm);
      const s = state.students.find(s=>s.id===segSelect.value);
      s.objectives = fd.get('objectives').trim();
      saveData();
      render();
    });
  }

  const topicForm = document.getElementById('topic-form');
  if(topicForm){
    topicForm.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(topicForm);
      state.topics.push({
        id: uid(),
        studentId: segSelect.value,
        date: fd.get('date'),
        topic: fd.get('topic').trim()
      });
      saveData();
      render();
    });
  }

  document.querySelectorAll('[data-del-topic]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar este tema?')) return;
      state.topics = state.topics.filter(t=>t.id!==btn.dataset.delTopic);
      saveData();
      render();
    });
  });

  const gradeForm = document.getElementById('grade-form');
  if(gradeForm){
    gradeForm.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(gradeForm);
      state.grades.push({
        id: uid(),
        studentId: segSelect.value,
        date: fd.get('date'),
        grade: fd.get('grade').trim(),
        comment: fd.get('comment').trim()
      });
      saveData();
      render();
    });
  }

  document.querySelectorAll('[data-del-grade]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm('¿Eliminar esta nota?')) return;
      state.grades = state.grades.filter(g=>g.id!==btn.dataset.delGrade);
      saveData();
      render();
    });
  });

}

let tutStep = 0;
function showTutorial(){
  tutStep = 0;
  drawTutorial();
  document.getElementById('tutorial').classList.add('show');
}
function closeTutorial(){
  document.getElementById('tutorial').classList.remove('show');
  try{ localStorage.setItem('cuaderno-guia-vista','1'); }catch(e){}
}
function drawTutorial(){
  const st = TUTORIAL[tutStep];
  document.getElementById('tut-emoji').textContent = st.e;
  document.getElementById('tut-title').textContent = st.t;
  document.getElementById('tut-body').innerHTML =
    st.b.map(x=>`<p>${x}</p>`).join('') + (st.tip ? `<p class="tip">${st.tip}</p>` : '');
  document.getElementById('tut-dots').innerHTML =
    TUTORIAL.map((_,i)=>`<span class="${i===tutStep ? 'on':''}"></span>`).join('');
  const last = tutStep === TUTORIAL.length-1;
  document.getElementById('tut-prev').style.visibility = tutStep===0 ? 'hidden' : 'visible';
  document.getElementById('tut-skip').style.visibility = last ? 'hidden' : 'visible';
  document.getElementById('tut-next').textContent = last ? '¡Empezar!' : 'Siguiente';
}
function maybeShowTutorial(){
  let seen = false;
  try{ seen = localStorage.getItem('cuaderno-guia-vista') === '1'; }catch(e){}
  if(!seen) showTutorial();
}
document.getElementById('help-btn').addEventListener('click', showTutorial);
document.getElementById('tut-skip').addEventListener('click', closeTutorial);
document.getElementById('tut-prev').addEventListener('click', ()=>{ if(tutStep>0){ tutStep--; drawTutorial(); } });
document.getElementById('tut-next').addEventListener('click', ()=>{
  if(tutStep < TUTORIAL.length-1){ tutStep++; drawTutorial(); }
  else closeTutorial();
});
document.getElementById('tutorial').addEventListener('click', e=>{
  if(e.target.id==='tutorial') closeTutorial();
});

function setupBackup(){
  // Resumen: backup
  const exportBtn = document.getElementById('export-btn');
  if(exportBtn){
    exportBtn.addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup-clases-ingles-${todayISO()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }

  const importBtn = document.getElementById('import-btn');
  const importFile = document.getElementById('import-file');
  if(importBtn && importFile){
    importBtn.addEventListener('click', ()=>importFile.click());
    importFile.addEventListener('change', ()=>{
      const file = importFile.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const parsed = JSON.parse(reader.result);
          if(!confirm('Esto va a reemplazar todos los datos actuales por los del backup. ¿Continuar?')) return;
          state.students = parsed.students || [];
          state.payments = parsed.payments || [];
          state.attendance = parsed.attendance || [];
          state.topics = parsed.topics || [];
          state.grades = parsed.grades || [];
          state.offDays = parsed.offDays || [];
          saveData();
          render();
        }catch(e){
          alert('No se pudo leer el archivo. ¿Es un backup válido?');
        }
      };
      reader.readAsText(file);
      importFile.value = '';
    });
  }
}
setupBackup();
subscribeToData();
</script>
