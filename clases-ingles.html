<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cuaderno de clases</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

:root{
  --cover: #6B2B3A;
  --cover-dark: #4E1F2C;
  --page: #FBF7F0;
  --page-line: #E4DACD;
  --ink: #2B2420;
  --ink-soft: #83766A;
  --sage: #6F8F71;
  --sage-bg: #E7EEE3;
  --clay: #C1633C;
  --clay-bg: #F5E4D8;
  --gold: #B08D4F;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  color:var(--ink);
  background:var(--page-line);
  min-height:100vh;
  padding:24px 16px 60px;
}

.book{
  max-width:720px;
  margin:0 auto;
  background:var(--page);
  border-radius:4px;
  box-shadow:0 1px 0 rgba(0,0,0,.03), 0 12px 30px rgba(43,36,32,.14);
  overflow:hidden;
}

.cover{
  background:linear-gradient(155deg,var(--cover),var(--cover-dark));
  color:var(--page);
  padding:34px 30px 26px;
}

.cover h1{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:30px;
  margin:0 0 4px;
  letter-spacing:.2px;
}

.cover p{
  margin:0;
  font-size:14px;
  color:#E9D9DD;
  font-weight:400;
}

nav{
  display:flex;
  border-bottom:1px solid var(--page-line);
  background:#F3EEE3;
}

nav button{
  flex:1;
  padding:14px 10px;
  border:none;
  background:transparent;
  font-family:'Inter',sans-serif;
  font-size:14px;
  font-weight:500;
  color:var(--ink-soft);
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color .15s ease, border-color .15s ease;
}

nav button.active{
  color:var(--cover);
  border-bottom-color:var(--cover);
  background:var(--page);
}

main{
  padding:26px 28px 34px;
  min-height:320px;
}

h2.section-title{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:19px;
  margin:0 0 18px;
}

.empty{
  color:var(--ink-soft);
  font-size:14px;
  padding:22px 0;
  border-top:1px dashed var(--page-line);
  text-align:center;
}

/* form */
.form-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:4px;
  flex:1;
  min-width:120px;
}

.field label{
  font-size:11.5px;
  color:var(--ink-soft);
  font-weight:500;
}

input, select{
  font-family:'Inter',sans-serif;
  font-size:14px;
  padding:9px 10px;
  border:1px solid var(--page-line);
  border-radius:3px;
  background:#fff;
  color:var(--ink);
}

input:focus, select:focus{
  outline:none;
  border-color:var(--cover);
}

.btn{
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  font-weight:600;
  padding:9px 16px;
  border-radius:3px;
  border:1px solid var(--cover);
  background:var(--cover);
  color:var(--page);
  cursor:pointer;
  transition:opacity .15s ease;
}
.btn:hover{opacity:.88;}
.btn.secondary{
  background:transparent;
  color:var(--cover);
}

/* ledger list */
.ledger{
  border-top:1px solid var(--page-line);
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--page-line);
}

.row-main{flex:1; min-width:0;}

.row-name{
  font-family:'Fraunces',serif;
  font-size:16px;
  font-weight:500;
}

.row-sub{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-top:2px;
}

.badge{
  font-size:11px;
  font-weight:600;
  padding:3px 9px;
  border-radius:20px;
  white-space:nowrap;
}
.badge.gold{background:#F1E7D2; color:var(--gold);}
.badge.sage{background:var(--sage-bg); color:var(--sage);}
.badge.clay{background:var(--clay-bg); color:var(--clay);}

.icon-btn{
  border:none;
  background:none;
  color:var(--ink-soft);
  cursor:pointer;
  font-size:13px;
  padding:4px 6px;
}
.icon-btn:hover{color:var(--clay);}

.select-student{
  margin-bottom:18px;
}

.summary{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}
.summary .card{
  flex:1;
  background:#F3EEE3;
  border-radius:4px;
  padding:12px 14px;
}
.summary .card .num{
  font-family:'Fraunces',serif;
  font-size:20px;
  font-weight:500;
}
.summary .card .lbl{
  font-size:11.5px;
  color:var(--ink-soft);
  margin-top:2px;
}

.calc-box{
  margin-top:26px;
  padding-top:20px;
  border-top:1px solid var(--page-line);
}

.calc-title{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:16px;
  margin:0 0 14px;
}

.calc-result{
  margin-top:14px;
}

.calc-result table{
  width:100%;
  border-collapse:collapse;
}

.calc-result th, .calc-result td{
  text-align:left;
  padding:8px 4px;
  font-size:13.5px;
  border-bottom:1px solid var(--page-line);
}

.calc-result th{
  color:var(--ink-soft);
  font-weight:500;
  font-size:11.5px;
}

.calc-result td.amount{
  font-family:'Fraunces',serif;
  font-weight:500;
}

.calc-result .calc-total{
  margin-top:10px;
  font-size:13px;
  color:var(--ink-soft);
}

.att-buttons{
  display:flex;
  gap:8px;
}
.att-btn{
  flex:1;
  padding:10px;
  border-radius:3px;
  border:1px solid var(--page-line);
  background:#fff;
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  color:var(--ink-soft);
}
.att-btn.present{border-color:var(--sage); }
.att-btn.present.chosen{background:var(--sage-bg); color:var(--sage);}
.att-btn.absent{border-color:var(--clay);}
.att-btn.absent.chosen{background:var(--clay-bg); color:var(--clay);}

.footnote{
  text-align:center;
  font-size:11.5px;
  color:var(--ink-soft);
  margin-top:16px;
}
</style>
</head>
<body>

<div class="book">
  <div class="cover">
    <h1>Cuaderno de clases</h1>
    <p>Alumnos, pagos y asistencia en un solo lugar</p>
  </div>

  <nav>
    <button class="tab-btn active" data-tab="alumnos">Alumnos</button>
    <button class="tab-btn" data-tab="pagos">Pagos</button>
    <button class="tab-btn" data-tab="asistencia">Asistencia</button>
  </nav>

  <main id="main"></main>
</div>

<script>
const DAYS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
let state = { students: [], payments: [], attendance: [] };
let activeTab = "alumnos";
let loaded = false;

async function loadData(){
  try{
    const res = await window.storage.get('app-data', true);
    if(res && res.value){
      state = JSON.parse(res.value);
      state.students = state.students || [];
      state.payments = state.payments || [];
      state.attendance = state.attendance || [];
    }
  }catch(e){
    // no data yet
  }
  loaded = true;
  render();
}

async function saveData(){
  try{
    await window.storage.set('app-data', JSON.stringify(state), true);
  }catch(e){
    console.error('No se pudo guardar', e);
  }
}

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  render();
}

document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click', ()=>switchTab(b.dataset.tab));
});

function render(){
  const main = document.getElementById('main');
  if(!loaded){
    main.innerHTML = '<div class="empty">Cargando…</div>';
    return;
  }
  if(activeTab==='alumnos') main.innerHTML = renderAlumnos();
  if(activeTab==='pagos') main.innerHTML = renderPagos();
  if(activeTab==='asistencia') main.innerHTML = renderAsistencia();
  attachHandlers();
}

/* ---------- ALUMNOS ---------- */
function renderAlumnos(){
  const rows = state.students.map(s=>`
    <div class="row">
      <div class="row-main">
        <div class="row-name">${escapeHtml(s.name)}</div>
        <div class="row-sub">${s.day} · ${s.time || 'sin horario'}</div>
      </div>
      <span class="badge gold">${s.freq}x/sem</span>
      <button class="icon-btn" data-del-student="${s.id}">Eliminar</button>
    </div>
  `).join('');

  return `
    <h2 class="section-title">Alumnos</h2>
    <form id="student-form">
      <div class="form-row">
        <div class="field">
          <label>Nombre</label>
          <input type="text" name="name" required placeholder="Nombre del alumno">
        </div>
        <div class="field">
          <label>Día</label>
          <select name="day">
            ${DAYS.map(d=>`<option value="${d}">${d}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Horario</label>
          <input type="text" name="time" placeholder="Ej: 18:00">
        </div>
        <div class="field">
          <label>Frecuencia semanal</label>
          <select name="freq">
            <option value="1">1 vez por semana</option>
            <option value="2">2 veces por semana</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn">Agregar alumno</button>
    </form>
    <div class="ledger">
      ${rows || '<div class="empty">Todavía no cargaste alumnos</div>'}
    </div>
  `;
}

/* ---------- PAGOS ---------- */
function renderPagos(){
  const options = state.students.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
  if(state.students.length===0){
    return `<h2 class="section-title">Pagos</h2><div class="empty">Cargá primero un alumno en la pestaña Alumnos</div>`;
  }
  const selected = window._selectedPagoStudent || state.students[0].id;
  const studentPayments = state.payments.filter(p=>p.studentId===selected).sort((a,b)=>b.date.localeCompare(a.date));
  const total = studentPayments.reduce((sum,p)=>sum+Number(p.amount||0),0);
  const last = studentPayments[0];

  const rows = studentPayments.map(p=>`
    <div class="row">
      <div class="row-main">
        <div class="row-name">$${Number(p.amount).toLocaleString('es-AR')}</div>
        <div class="row-sub">${formatDate(p.date)}${p.note ? ' · '+escapeHtml(p.note) : ''}</div>
      </div>
      <button class="icon-btn" data-del-payment="${p.id}">Eliminar</button>
    </div>
  `).join('');

  return `
    <h2 class="section-title">Pagos</h2>
    <div class="select-student">
      <select id="pago-student-select">${options}</select>
    </div>
    <div class="summary">
      <div class="card">
        <div class="num">$${total.toLocaleString('es-AR')}</div>
        <div class="lbl">Total registrado</div>
      </div>
      <div class="card">
        <div class="num">${last ? formatDate(last.date) : '—'}</div>
        <div class="lbl">Último pago</div>
      </div>
    </div>
    <form id="payment-form">
      <div class="form-row">
        <div class="field">
          <label>Monto</label>
          <input type="number" name="amount" min="0" step="1" required placeholder="0">
        </div>
        <div class="field">
          <label>Fecha</label>
          <input type="date" name="date" required value="${todayISO()}">
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Nota (opcional)</label>
          <input type="text" name="note" placeholder="Ej: clases de septiembre">
        </div>
      </div>
      <button type="submit" class="btn">Registrar pago</button>
    </form>
    <div class="ledger">
      ${rows || '<div class="empty">Todavía no hay pagos registrados</div>'}
    </div>

    <div class="calc-box">
      <h3 class="calc-title">Calculadora de aumentos</h3>
      <div class="form-row">
        <div class="field">
          <label>Precio actual</label>
          <input type="number" id="calc-price" min="0" step="1" placeholder="0">
        </div>
        <div class="field">
          <label>% de aumento</label>
          <input type="number" id="calc-percent" min="0" step="0.1" placeholder="0">
        </div>
        <div class="field">
          <label>Meses a proyectar</label>
          <input type="number" id="calc-months" min="1" step="1" value="1">
        </div>
      </div>
      <button type="button" class="btn secondary" id="calc-btn">Calcular</button>
      <div class="calc-result" id="calc-result"></div>
    </div>
  `;
}

/* ---------- ASISTENCIA ---------- */
function renderAsistencia(){
  if(state.students.length===0){
    return `<h2 class="section-title">Asistencia</h2><div class="empty">Cargá primero un alumno en la pestaña Alumnos</div>`;
  }
  const options = state.students.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
  const selected = window._selectedAsisStudent || state.students[0].id;
  const records = state.attendance.filter(a=>a.studentId===selected).sort((a,b)=>b.date.localeCompare(a.date));

  const rows = records.map(a=>`
    <div class="row">
      <div class="row-main">
        <div class="row-name">${formatDate(a.date)}</div>
      </div>
      <span class="badge ${a.present ? 'sage' : 'clay'}">${a.present ? 'Presente' : 'Ausente'}</span>
      <button class="icon-btn" data-del-att="${a.id}">Eliminar</button>
    </div>
  `).join('');

  return `
    <h2 class="section-title">Asistencia</h2>
    <div class="select-student">
      <select id="asis-student-select">${options}</select>
    </div>
    <form id="attendance-form">
      <div class="form-row">
        <div class="field">
          <label>Fecha de la clase</label>
          <input type="date" name="date" required value="${todayISO()}">
        </div>
      </div>
      <div class="att-buttons" id="att-choice">
        <button type="button" class="att-btn present chosen" data-present="1">Presente</button>
        <button type="button" class="att-btn absent" data-present="0">Ausente</button>
      </div>
      <div style="margin-top:14px;">
        <button type="submit" class="btn">Guardar</button>
      </div>
    </form>
    <div class="ledger" style="margin-top:8px;">
      ${rows || '<div class="empty">Todavía no hay registros de asistencia</div>'}
    </div>
  `;
}

/* ---------- handlers ---------- */
function attachHandlers(){
  const studentForm = document.getElementById('student-form');
  if(studentForm){
    studentForm.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(studentForm);
      state.students.push({
        id: uid(),
        name: fd.get('name').trim(),
        day: fd.get('day'),
        time: fd.get('time').trim(),
        freq: fd.get('freq')
      });
      saveData();
      render();
    });
  }

  document.querySelectorAll('[data-del-student]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.delStudent;
      state.students = state.students.filter(s=>s.id!==id);
      state.payments = state.payments.filter(p=>p.studentId!==id);
      state.attendance = state.attendance.filter(a=>a.studentId!==id);
      saveData();
      render();
    });
  });

  const pagoSelect = document.getElementById('pago-student-select');
  if(pagoSelect){
    pagoSelect.value = window._selectedPagoStudent || state.students[0].id;
    pagoSelect.addEventListener('change', ()=>{
      window._selectedPagoStudent = pagoSelect.value;
      render();
    });
  }

  const paymentForm = document.getElementById('payment-form');
  if(paymentForm){
    paymentForm.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(paymentForm);
      state.payments.push({
        id: uid(),
        studentId: pagoSelect.value,
        amount: fd.get('amount'),
        date: fd.get('date'),
        note: fd.get('note').trim()
      });
      saveData();
      render();
    });
  }

  document.querySelectorAll('[data-del-payment]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.payments = state.payments.filter(p=>p.id!==btn.dataset.delPayment);
      saveData();
      render();
    });
  });

  const calcBtn = document.getElementById('calc-btn');
  if(calcBtn){
    calcBtn.addEventListener('click', ()=>{
      const price = Number(document.getElementById('calc-price').value);
      const percent = Number(document.getElementById('calc-percent').value);
      const months = Math.max(1, Number(document.getElementById('calc-months').value) || 1);
      const resultBox = document.getElementById('calc-result');

      if(!price || !percent){
        resultBox.innerHTML = '<div class="empty" style="border-top:none;padding:10px 0;">Completá precio actual y % de aumento</div>';
        return;
      }

      let current = price;
      let rowsHtml = '';
      for(let i=1; i<=months; i++){
        current = current * (1 + percent/100);
        rowsHtml += `<tr><td>Mes ${i}</td><td class="amount">$${Math.round(current).toLocaleString('es-AR')}</td></tr>`;
      }
      const totalIncrease = current - price;

      resultBox.innerHTML = `
        <table>
          <thead><tr><th>Proyección</th><th>Precio</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <div class="calc-total">Aumento acumulado: $${Math.round(totalIncrease).toLocaleString('es-AR')} (de $${price.toLocaleString('es-AR')} a $${Math.round(current).toLocaleString('es-AR')})</div>
      `;
    });
  }

  const asisSelect = document.getElementById('asis-student-select');
  if(asisSelect){
    asisSelect.value = window._selectedAsisStudent || state.students[0].id;
    asisSelect.addEventListener('change', ()=>{
      window._selectedAsisStudent = asisSelect.value;
      render();
    });
  }

  const attChoice = document.getElementById('att-choice');
  let presentValue = '1';
  if(attChoice){
    attChoice.querySelectorAll('.att-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        presentValue = btn.dataset.present;
        attChoice.querySelectorAll('.att-btn').forEach(b=>b.classList.remove('chosen'));
        btn.classList.add('chosen');
      });
    });
  }

  const attendanceForm = document.getElementById('attendance-form');
  if(attendanceForm){
    attendanceForm.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(attendanceForm);
      state.attendance.push({
        id: uid(),
        studentId: asisSelect.value,
        date: fd.get('date'),
        present: presentValue === '1'
      });
      saveData();
      render();
    });
  }

  document.querySelectorAll('[data-del-att]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.attendance = state.attendance.filter(a=>a.id!==btn.dataset.delAtt);
      saveData();
      render();
    });
  });
}

/* ---------- utils ---------- */
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function todayISO(){
  return new Date().toISOString().slice(0,10);
}
function formatDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

loadData();
</script>
</body>
</html>
